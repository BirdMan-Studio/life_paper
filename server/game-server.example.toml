server_id = "game-1"
host = "127.0.0.1"
port = 8081
data_dir = "data-game-1"

[registration]
central_api_url = "http://127.0.0.1:8080/api/v1"
public_api_url = "http://127.0.0.1:8081/api/v1"
# Generated by the central admin UI when adding this server or resetting its key.
verification_key = "REPLACE_WITH_CENTRALLY_ISSUED_GAME_SERVER_KEY"

[auth]
mode = "central"
# Pin the public_key returned by the trusted central service:
# GET /api/v1/auth/game-public-key
public_key = "REPLACE_WITH_CENTRAL_ED25519_PUBLIC_KEY"

[ai]
enabled = false
python = "python"
timeout_ms = 2000
max_queries = 256
workers = 2
cache_entries = 8
