[package]
name = "client"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.33.3"
rfd = "0.15"
directories = "6.0"
keyring = "4.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
toml = "1.1"
uuid = { version = "1", features = ["v4"] }
